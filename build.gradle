buildscript { 
    repositories { 
        maven { 
            url('/opt/android-plugin')
        }
        google()
        mavenCentral()
    }
    dependencies { 
        classpath('com.android.tools.build:gradle:7.4.0-dev')
    }
}
allprojects { 
    repositories { 
        maven { 
            url('/opt/android-plugin')
        }
        google()
        mavenCentral()
        maven { 
            url('https://jitpack.io')
        }
    }
    tasks.withType(JavaCompile, { 
        options.compilerArgs << '-Xlint:unchecked' << '-Xlint:deprecation'
    })
}
task(clean(['type': Delete ], { 
    delete(rootProject.buildDir)
}))
